<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Keuangan Shopee</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;font-family:Arial,sans-serif;color:#202a33}
header{background:#ee4d2d;color:#fff;padding:18px 14px}
header h1{margin:0 0 5px;font-size:20px} header small{opacity:.9}
main{max-width:900px;margin:auto;padding:12px}
section,.card{background:#fff;border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h2{font-size:16px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{margin:0}.card small{display:block;color:#68737d;font-size:11px}.card b{display:block;margin-top:6px;font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
button,select,input{width:100%;padding:11px;border-radius:9px;font-size:14px}
button{border:0;background:#ee4d2d;color:#fff;font-weight:bold}
button.gray{background:#66717c}.red{background:#d63b35!important}
.tabs button{background:#e8edf1;color:#303a43;font-size:11px}.tabs button.active{background:#ee4d2d;color:#fff}
label{display:block;font-size:11px;font-weight:bold;color:#5d6872;margin:10px 0 5px}
input,select{border:1px solid #d6dce1;background:#fff}
.full{margin-top:12px}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf0f2;font-size:13px}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:9px 6px;border-bottom:1px solid #e7eaed;text-align:left;font-size:12px}
th{background:#f5f7f8}
.actions{display:flex;gap:5px}.actions button{width:auto;padding:7px 9px;font-size:11px}
.notice{background:#fff5ef;border-radius:9px;padding:9px;font-size:12px;margin-top:10px}
.editing{background:#fff0e8;border:2px solid #ee4d2d}
@media(max-width:520px){
 .tabs button{font-size:10px;padding:9px 2px}
 .table{overflow:visible} table{min-width:0}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 #history tr{background:#fff;border:1px solid #e3e7ea;border-radius:10px;margin:8px 0;padding:8px}
 #history td{border:0;padding:5px 2px;display:flex}
 #history td:before{font-weight:bold;color:#69747d;width:88px;flex:none}
 #history td:nth-child(1):before{content:"Tanggal"}
 #history td:nth-child(2):before{content:"Jenis"}
 #history td:nth-child(3):before{content:"Kategori"}
 #history td:nth-child(4):before{content:"Keterangan"}
 #history td:nth-child(5):before{content:"Nominal"}
 #history td:nth-child(6):before{content:"Aksi"}
}
</style>
</head>
<body>
<header>
<h1>MONITORING KEUANGAN SHOPEE</h1>
<small id="clock"></small>
</header>
<main>
<div class="cards" id="cards"></div>

<section id="inputSection">
<h2 id="inputTitle">Input Transaksi</h2>
<div class="tabs" id="tabs">
<button data-type="modal">Modal</button>
<button data-type="paylater">PayLater</button>
<button data-type="masuk">Pemasukan</button>
<button data-type="keluar">Pengeluaran</button>
<button data-type="rrak">RRAK</button>
</div>
<form id="form">
<label>KATEGORI</label><select id="kategori"></select>
<label>NOMINAL (Rp)</label><input id="nominal" type="number" min="1" required>
<div id="ketWrap" style="display:none"><label>KETERANGAN / BELI APA</label><input id="keterangan" maxlength="200"></div>
<button id="saveBtn" class="full" type="submit">+ SIMPAN TRANSAKSI</button>
<button id="cancelBtn" class="full gray" type="button" style="display:none">BATAL EDIT</button>
</form>
<div id="editNotice" class="notice" style="display:none">Mode edit aktif. Ubah data lalu tekan <b>SIMPAN PERUBAHAN</b>.</div>
</section>

<section>
<h2>Riwayat Transaksi</h2>
<label>FILTER JENIS</label>
<select id="filter">
<option value="semua">Semua</option><option value="modal">Modal</option>
<option value="paylater">PayLater</option><option value="masuk">Pemasukan</option>
<option value="keluar">Pengeluaran</option><option value="rrak">RRAK</option>
</select>
<input id="search" placeholder="Cari kategori / keterangan" style="margin-top:7px">
<div id="filterInfo" class="notice">Pilih transaksi untuk Edit atau Hapus.</div>
<div class="table">
<table><thead><tr><th>Tanggal & Jam</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Aksi</th></tr></thead>
<tbody id="history"></tbody></table>
</div>
</section>

<section>
<h2>Export & Backup</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
<button id="excel">KIRIM KE EXCEL</button>
<button id="backup" class="gray">BACKUP JSON</button>
<button id="restore" class="gray">IMPORT BACKUP</button>
<button id="clear" class="red">HAPUS SEMUA</button>
</div>
<input id="file" type="file" accept=".json" hidden>
</section>
</main>

<script>
const KEY='monitoring_keuangan_shopee_v1';
const CATS={
 modal:['Modal Awal','Modal Tambahan'],
 paylater:['Modal Pinjaman PayLater','Pencairan PayLater'],
 masuk:['Penjualan Shopee','Pencairan Saldo Shopee','Pemasukan Lainnya'],
 keluar:['Belanja Stok','Biaya Shopee','Iklan','Packing/Kardus/Bubble','Ongkir','Cicilan PayLater','Pengeluaran Lainnya'],
 rrak:['Kebutuhan RRAK']
};
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}
if(!data||!Array.isArray(data.transaksi))data={transaksi:[],rrak:[]};
if(!Array.isArray(data.rrak))data.rrak=[];
let currentType='modal';
let editingId=null, editingType=null;

const $=id=>document.getElementById(id);
function rp(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){let d=new Date(v);return d.toLocaleDateString('id-ID')+' '+d.toLocaleTimeString('id-ID')}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function all(){return [...data.transaksi,...data.rrak]}

function choose(type){
 currentType=type;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
 $('kategori').innerHTML=CATS[type].map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
 $('ketWrap').style.display=type==='rrak'?'block':'none';
 $('keterangan').required=type==='rrak';
 if(type!=='rrak')$('keterangan').value='';
 $('keterangan').placeholder='Contoh: Beli kardus packing';
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>choose(b.dataset.type));

$('form').onsubmit=function(e){
 e.preventDefault();
 const n=Number($('nominal').value);
 const k=currentType==='rrak'?$('keterangan').value.trim():'';
 if(!n||n<=0)return alert('Nominal harus lebih dari 0.');
 if(currentType==='rrak'&&!k)return alert('Keterangan wajib diisi.');

 if(editingId!==null){
   const arr=editingType==='rrak'?data.rrak:data.transaksi;
   const item=arr.find(x=>String(x.id)===String(editingId));
   if(!item)return alert('Transaksi tidak ditemukan.');
   item.kategori=$('kategori').value;
   item.nominal=n;
   item.keterangan=k;
   editingId=null;editingType=null;
   $('inputTitle').textContent='Input Transaksi';
   $('saveBtn').textContent='+ SIMPAN TRANSAKSI';
   $('cancelBtn').style.display='none';
   $('editNotice').style.display='none';
   $('form').reset();choose(currentType);save();
   alert('Perubahan berhasil disimpan.');
 }else{
   const item={id:String(Date.now()+Math.random()),timestamp:new Date().toISOString(),jenis:currentType,kategori:$('kategori').value,keterangan:k,nominal:n};
   if(currentType==='rrak')data.rrak.unshift(item);else data.transaksi.unshift(item);
   $('form').reset();choose(currentType);save();
 }
};

$('cancelBtn').onclick=function(){
 editingId=null;editingType=null;
 $('inputTitle').textContent='Input Transaksi';
 $('saveBtn').textContent='+ SIMPAN TRANSAKSI';
 $('cancelBtn').style.display='none';
 $('editNotice').style.display='none';
 $('form').reset();choose(currentType);
};

function editTransaction(id,type){
 const arr=type==='rrak'?data.rrak:data.transaksi;
 const item=arr.find(x=>String(x.id)===String(id));
 if(!item)return alert('Transaksi tidak ditemukan.');
 editingId=String(id);editingType=type;
 currentType=type;choose(type);
 $('kategori').value=item.kategori;
 $('nominal').value=item.nominal;
 $('keterangan').value=item.keterangan;
 $('inputTitle').textContent='EDIT TRANSAKSI';
 $('saveBtn').textContent='SIMPAN PERUBAHAN';
 $('cancelBtn').style.display='block';
 $('editNotice').style.display='block';
 $('inputSection').classList.add('editing');
 $('inputSection').scrollIntoView({behavior:'smooth',block:'start'});
}

function deleteTransaction(id,type){
 if(!confirm('Hapus transaksi ini?'))return;
 const arr=type==='rrak'?data.rrak:data.transaksi;
 const idx=arr.findIndex(x=>String(x.id)===String(id));
 if(idx>=0)arr.splice(idx,1);
 if(String(editingId)===String(id))$('cancelBtn').click();
 save();
}

function calc(){
 let modal=0,pay=0,masuk=0,keluar=0,rrak=0,cicilan=0;
 data.transaksi.forEach(x=>{
  let n=Number(x.nominal)||0;
  if(x.jenis==='modal')modal+=n;
  else if(x.jenis==='paylater')pay+=n;
  else if(x.jenis==='masuk')masuk+=n;
  else if(x.jenis==='keluar'){keluar+=n;if(x.kategori==='Cicilan PayLater')cicilan+=n}
 });
 data.rrak.forEach(x=>rrak+=Number(x.nominal)||0);
 return {modal,pay,masuk,keluar,rrak,total:keluar+rrak,cicilan,
 margin:masuk-(keluar+rrak),saldo:modal+pay+masuk-keluar-rrak,
 sisaPay:Math.max(0,pay-cicilan)};
}

function render(){
 const c=calc();
 const cards=[['MODAL AWAL',c.modal],['MODAL PAYLATER',c.pay],['TOTAL PEMASUKAN',c.masuk],['TOTAL PENGELUARAN',c.total],['KEBUTUHAN RRAK',c.rrak],['TOTAL MARGIN',c.margin],['SALDO BERJALAN',c.saldo],['SISA PAYLATER',c.sisaPay]];
 $('cards').innerHTML=cards.map(x=>'<div class="card"><small>'+x[0]+'</small><b>'+rp(x[1])+'</b></div>').join('');
 const f=$('filter').value,q=$('search').value.toLowerCase();
 const rows=all().filter(x=>(f==='semua'||x.jenis===f)&&((x.kategori+' '+x.keterangan).toLowerCase().includes(q)));
 $('filterInfo').innerHTML='Filter: <b>'+f.toUpperCase()+'</b> &nbsp;|&nbsp; '+rows.length+' transaksi &nbsp;|&nbsp; Total <b>'+rp(rows.reduce((a,x)=>a+Number(x.nominal||0),0))+'</b>';
 $('history').innerHTML=rows.length?rows.map(x=>`
 <tr>
 <td>${fmt(x.timestamp)}</td><td>${esc(x.jenis.toUpperCase())}</td><td>${esc(x.kategori)}</td>
 <td>${esc(x.keterangan)}</td><td><b>${rp(x.nominal)}</b></td>
 <td><div class="actions">
 <button type="button" onclick="editTransaction('${String(x.id).replace(/'/g,"\\'")}','${x.jenis}')">EDIT</button>
 <button type="button" class="red" onclick="deleteTransaction('${String(x.id).replace(/'/g,"\\'")}','${x.jenis}')">HAPUS</button>
 </div></td>
 </tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:20px">Belum ada transaksi</td></tr>';
}
$('filter').onchange=render;$('search').oninput=render;
function tick(){$('clock').textContent='Waktu sekarang: '+fmt(new Date())} tick();setInterval(tick,1000);

$('clear').onclick=()=>{if(confirm('Hapus semua data?')){data={transaksi:[],rrak:[]};save()}};
$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='backup-keuangan-shopee.json';a.click()};
$('restore').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.transaksi)||!Array.isArray(x.rrak))throw 0;data=x;save();alert('Backup berhasil diimport')}catch{alert('Backup tidak valid')}};

$('excel').onclick=()=>{
 let rows=all(),out=[['TANGGAL','JAM','JENIS','KATEGORI','KETERANGAN','NOMINAL']];
 rows.forEach(x=>{let d=new Date(x.timestamp);out.push([d.toLocaleDateString('id-ID'),d.toLocaleTimeString('id-ID'),x.jenis.toUpperCase(),x.kategori,x.keterangan,x.nominal])});
 let csv='\ufeff'+out.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='laporan-keuangan-shopee.csv';a.click();
};

choose('modal');render();
</script>
</body>
</html>
